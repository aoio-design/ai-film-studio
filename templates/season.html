<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ season.title }} — AI Film Studio</title>
<link rel="stylesheet" href="{{ url_for('static', filename='studio.css') }}?v=11">
<style>
.nav {
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:16px;
  padding:10px 24px; background:var(--panel);
  border-bottom:1px solid var(--line);
}
.nav .spacer { flex:1; }
.nav .sep { color:var(--line); }
.back { color:var(--blue); text-decoration:none; font-size:13px; font-weight:500; }
.back:hover { text-decoration:underline; }
.wrap { max-width:900px; margin:0 auto; padding:40px 24px 90px; }
h1 { font-size:27px; font-weight:800; letter-spacing:-.022em; margin:0 0 6px; }
.subtitle { color:var(--mut); font-size:14px; margin-bottom:26px; }
h3 { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
     color:var(--mut); margin:26px 0 12px; }

/* One shared card style for BOTH the assets card and the episode cards (10b).
   Padding sits on the card element itself so nothing can spill (10d). */
.card-link {
  display:block; text-decoration:none; color:inherit;
  background:var(--panel); border:1px solid var(--line);
  border-radius:var(--r-lg); box-shadow:var(--shadow-sm);
  padding:20px 22px;
  transition:transform .18s ease, box-shadow .18s, border-color .18s;
}
.card-link:hover { transform:scale(1.012); box-shadow:var(--shadow); border-color:var(--blue); }
.card-link .num { font-size:11px; font-weight:700; color:var(--blue);
                  letter-spacing:.08em; text-transform:uppercase; }
.card-link .ttl { font-size:15.5px; font-weight:650; margin-top:5px; color:var(--text);
                  line-height:1.3; overflow-wrap:anywhere; }
/* 10c: was --mut (too light on white) — use full-strength secondary text */
.card-link .meta { font-size:12.5px; color:var(--mut); margin-top:7px; font-weight:500; }

.ep-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px; }
.assets-card { margin-bottom:4px; }
.assets-card .ttl { display:flex; align-items:center; gap:9px; }
</style>
</head>
<body>
<nav class="nav">
  <a class="brand" href="/projects" title="Home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Home"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></a>
  <span class="spacer"></span>
  <nav class="nav-pillbox" aria-label="Studio sections">
    <a class="nav-pill" href="/projects">Projects</a>
  </nav>
  <button class="theme-toggle" onclick="toggleTheme()" title="Toggle appearance">🌙</button>
</nav>
<div class="wrap">
  <h1>{{ season.title }}</h1>
  <p class="subtitle">{{ season.episodes|length }} episodes</p>

  <h3>Season assets</h3>
  <a class="card-link assets-card" href="/a/{{ season.id }}">
    <div class="num">Reference library</div>
    <div class="ttl">📖 Character Bible &amp; Assets</div>
    <div class="meta">Characters, locations, props and voice references</div>
  </a>

  <h3>Episodes</h3>
  <div class="ep-grid">
    {% for ep in season.episodes %}
    <a class="card-link" href="/p/{{ ep.id }}">
      <div class="num">{{ ep.id }}</div>
      <div class="ttl">{{ ep.title }}</div>
      <div class="meta">{{ ep.shots }} shots</div>
    </a>
    {% endfor %}
  </div>
</div>
<script src="{{ url_for('static', filename='studio.js') }}?v=12"></script>
</body>
</html>
